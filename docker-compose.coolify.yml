services:
  openmaic:
    build:
      context: .
    expose:
      - '3000'
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'providers:\n  omniroute:\n    apiKey: "%s"\n    baseUrl: "http://192.168.1.66:20128/v1"\n    models: ["worker","strong","standard","light","vision"]\n' "$$OMNIROUTE_API_KEY" > /app/server-providers.yml
        exec node server.js
    volumes:
      - openmaic-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  openmaic-data:
